esphome:
  name: aula_sensors

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESPHome Fallback"
    password: "fallback1234"
  manual_ip:
    static_ip: 10.50.101.19
    gateway: 10.50.0.1
    subnet: 255.255.0.0

api:
  reboot_timeout: 0s

remote_receiver:
  pin:
    number: GPIO14   # receptor IR TL1838
    inverted: true
  dump: raw
  tolerance: 30%

remote_transmitter:
  pin: GPIO4        # transmisor IR
  carrier_duty_percent: 50%

