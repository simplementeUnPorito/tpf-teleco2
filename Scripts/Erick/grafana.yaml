apiVersion: 1

datasources:
  - name: InfluxDB_v2
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: teleco2
      defaultBucket: perfumes
      tlsSkipVerify: true
    secureJsonData:
      token: CHANGE_ME_INFLUX_TOKEN
